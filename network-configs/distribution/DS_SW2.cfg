version 12.2(37)SE1
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname DS_SW2
!
!
!
!
!
!
ip routing
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
spanning-tree mode rapid-pvst
spanning-tree vlan 20,30 priority 4096
spanning-tree vlan 10 priority 8192
!
!
!
!
!
!
interface FastEthernet0/1
 no switchport
 ip address 10.0.1.14 255.255.255.252
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 duplex auto
 speed auto
!
interface FastEthernet0/2
 no switchport
 ip address 10.0.1.6 255.255.255.252
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 duplex auto
 speed auto
!
interface FastEthernet0/3
 switchport trunk allowed vlan 10,20,30,56
 switchport trunk encapsulation dot1q
 switchport mode trunk
!
interface FastEthernet0/4
 switchport trunk allowed vlan 10,20,30,56
 switchport trunk encapsulation dot1q
 switchport mode trunk
!
interface FastEthernet0/5
 switchport trunk allowed vlan 10,20,30,56
 switchport trunk encapsulation dot1q
 switchport mode trunk
!
interface FastEthernet0/6
!
interface FastEthernet0/7
!
interface FastEthernet0/8
!
interface FastEthernet0/9
!
interface FastEthernet0/10
!
interface FastEthernet0/11
!
interface FastEthernet0/12
!
interface FastEthernet0/13
!
interface FastEthernet0/14
!
interface FastEthernet0/15
!
interface FastEthernet0/16
!
interface FastEthernet0/17
!
interface FastEthernet0/18
!
interface FastEthernet0/19
!
interface FastEthernet0/20
!
interface FastEthernet0/21
!
interface FastEthernet0/22
!
interface FastEthernet0/23
!
interface FastEthernet0/24
!
interface GigabitEthernet0/1
!
interface GigabitEthernet0/2
!
interface Vlan1
 no ip address
 shutdown
!
interface Vlan10
 mac-address 00e0.f993.2101
 ip address 192.168.11.2 255.255.255.0
 ip access-group DB-PROTECT in
 standby 1 ip 192.168.11.254
 standby 1 preempt
!
interface Vlan20
 mac-address 00e0.f993.2102
 ip address 192.168.20.2 255.255.255.0
 standby 1 ip 192.168.20.254
 standby 1 priority 110
 standby 1 preempt
!
interface Vlan30
 mac-address 00e0.f993.2103
 ip address 192.168.30.2 255.255.255.0
 standby 1 ip 192.168.30.254
 standby 1 priority 110
 standby 1 preempt
!
interface Vlan56
 mac-address 00e0.f993.2104
 ip address 192.168.56.2 255.255.255.0
!
interface Vlan60
 mac-address 00e0.f993.2105
 ip address 192.168.60.2 255.255.255.0
!
router ospf 1
 router-id 4.4.4.4
 log-adjacency-changes
 passive-interface Vlan10
 passive-interface Vlan20
 passive-interface Vlan30
 passive-interface Vlan56
 network 10.0.1.4 0.0.0.3 area 0
 network 10.0.1.12 0.0.0.3 area 0
 network 192.168.11.0 0.0.0.255 area 0
 network 192.168.20.0 0.0.0.255 area 0
 network 192.168.30.0 0.0.0.255 area 0
 network 192.168.56.0 0.0.0.255 area 0
!
ip classless
!
ip flow-export version 9
!
!
ip access-list extended DB-PROTECT
 deny ip 192.168.11.0 0.0.0.255 host 192.168.30.30
 permit ip any any
!
!
!
!
!
!
line con 0
!
line aux 0
!
line vty 0 4
 login
!
!
!
!
end 
